<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 54" fill="none" aria-hidden="true">
  <defs>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('./fonts/sora-latin-700-normal.woff2') format('woff2');
      }
    </style>
    <linearGradient id="brand-dazzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.71" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.31" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wordmark-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.94" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(0,5.00)">
    <rect x="0.69" y="0.69" width="42.62" height="42.62" rx="13.75" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1.38"/>
  <text x="22.53" y="22.00" font-family="Sora, system-ui, sans-serif" font-size="17.16" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.055em" fill="url(#brand-dazzle)" filter="url(#sc-glow)">SC</text>
  </g>
  <text x="58" y="39" font-family="Sora, system-ui, sans-serif" font-size="33" font-weight="700" fill="url(#brand-dazzle)" filter="url(#wordmark-glow)" letter-spacing="-0.03em">StateCompass</text>
</svg>
