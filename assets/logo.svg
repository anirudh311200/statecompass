<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 46" fill="none" aria-hidden="true">
  <defs>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('./fonts/sora-latin-700-normal.woff2') format('woff2');
      }
    </style>
    <linearGradient id="sc-dazzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.36"/>
    </linearGradient>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.52" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.34" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(0,5.00)">
    <rect x="0.56" y="0.56" width="34.88" height="34.88" rx="11.25" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1.12"/>
  <text x="18.43" y="18.00" font-family="Sora, system-ui, sans-serif" font-size="12.78" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.055em" fill="url(#sc-dazzle)" filter="url(#sc-glow)">SC</text>
  </g>
  <text x="48" y="33" font-family="Sora, system-ui, sans-serif" font-size="28" font-weight="700" fill="#fafafa" letter-spacing="-0.03em">StateCompass</text>
</svg>
