<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('file:///D:/ani%20-%20work/statecompass/public/assets/fonts/sora-latin-700-normal.ttf') format('truetype');
      }
    </style>
    <linearGradient id="brand-dazzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.69" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.14" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wordmark-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.18" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="linkedin-vignette" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#linkedin-vignette)"/>
  <g transform="translate(300.00,256.50)">
    <g transform="translate(0,11.00)">
    <rect x="1.49" y="1.49" width="92.03" height="92.03" rx="29.69" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2.97"/>
  <text x="48.64" y="47.50" font-family="Sora, system-ui, sans-serif" font-size="37.05" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.055em" fill="url(#brand-dazzle)" filter="url(#sc-glow)">SC</text>
  </g>
    <text x="125" y="84" font-family="Sora, system-ui, sans-serif" font-size="71" font-weight="700" fill="url(#brand-dazzle)" filter="url(#wordmark-glow)" letter-spacing="-0.03em">StateCompass</text>
  </g>
</svg>
