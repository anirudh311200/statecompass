<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('./fonts/sora-latin-700-normal.woff2') format('woff2');
      }
    </style>
    <linearGradient id="sc-dazzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.35" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.38" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(2,2)">
    <rect x="0.44" y="0.44" width="27.12" height="27.12" rx="8.75" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.88"/>
  <text x="14.34" y="14.00" font-family="Sora, system-ui, sans-serif" font-size="10.92" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.055em" fill="url(#sc-dazzle)" filter="url(#sc-glow)">SC</text>
  </g>
</svg>
