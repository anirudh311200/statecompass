      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="og-sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.03" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.25" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
