<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('/assets/fonts/sora-latin-700-normal.woff2') format('woff2');
      }
    </style>
    <linearGradient id="sc-dazzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="52%" stop-color="#fafafa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="sc-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.59" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.07" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(11,11)">
    <rect x="2.47" y="2.47" width="153.06" height="153.06" rx="49.37" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="4.94"/>
  <text x="80.90" y="79.00" font-family="Sora, system-ui, sans-serif" font-size="61.62" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.055em" fill="url(#sc-dazzle)" filter="url(#sc-glow)">SC</text>
  </g>
</svg>
